[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "juggle-tracker"
version = "0.1.0"
description = "Per-person soccer juggle counter from a fixed camera, with Home Assistant integration"
requires-python = ">=3.9"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
