type: sections
sections:
  # ── Live camera ────────────────────────────────────────────────────────────
  - type: grid
    cards:
      - show_state: true
        show_name: true
        camera_view: live
        fit_mode: cover
        type: picture-entity
        entity: camera.front_yard
        name: Front Yard

  # ── Leaderboard + Reset buttons ────────────────────────────────────────────
  - type: grid
    cards:
      - type: custom:auto-entities
        card:
          type: entities
          title: 🏆 Leader Board ⚽
        filter:
          template: >
            {% set result = namespace(entities=[]) %}
            {% for s in states.sensor | selectattr('entity_id', 'search',
            '^sensor\.soccer_juggle_tracker_.+_juggle_high_score$') %}
              {% set clean_name = s.name | regex_replace(find='(?i)^Soccer Juggle Tracker\\s*', replace='') %}
              {% set result.entities = result.entities + [{'entity': s.entity_id, 'name': clean_name}] %}
            {% endfor %}
            {{ result.entities }}
        sort:
          method: state
          reverse: true
          numeric: true

      - type: custom:auto-entities
        card:
          title: Reset High Scores
        filter:
          template: >
            {% set result = namespace(cards=[]) %}
            {% for b in states.button | selectattr('entity_id', 'search',
            '^button\.soccer_juggle_tracker_reset_.+_high_score$') %}
              {% set player_raw = b.entity_id | regex_findall_index('reset_(.+)_high_score') %}
              {% set player_name = 'Unknown' if player_raw == 'unknown_juggler' else player_raw | replace('_', ' ') | title %}
              {% set button_card = {
                'type': 'button',
                'entity': b.entity_id,
                'name': player_name,
                'icon': 'mdi:trophy-broken',
                'show_name': true,
                'show_icon': true,
                'show_state': false,
                'icon_height': '48px',
                'tap_action': {
                  'action': 'perform-action',
                  'perform_action': 'button.press',
                  'target': {'entity_id': b.entity_id},
                  'confirmation': {
                    'text': "Reset the Unknown Juggler high score and delete the replay?" if player_raw == 'unknown_juggler'
                            else "Reset " ~ player_name ~ "'s high score and delete the replay?"
                  }
                }
              } %}
              {% set result.cards = result.cards + [button_card] %}
            {% endfor %}
            {{ result.cards }}
        visibility:
          - condition: user
            users:
              - d0f74d3b9c434882829a4a12a467bb22

  # ── Processing stats ───────────────────────────────────────────────────────
  - type: grid
    cards:
      - type: vertical-stack
        cards:
          - type: entities
            title: ⚙️ Processing Stats ⚙️
            entities:
              - entity: sensor.juggle_inbox_queue
                name: Inbox queue
              - type: divider
              - type: custom:entity-progress-card
                entity: sensor.soccer_juggle_tracker_juggle_processing_progress
                layout: horizontal
                size: medium
                name: Processing Progress
                bar_size: small
              - type: custom:entity-progress-card
                entity: sensor.frigate_box_macbook_pro_cpu_temperature
                layout: horizontal
                size: medium
                name: CPU Temperature
                bar_size: small
                theme: critical_when_high
                max_value: 90
                min_value: 70
              - type: custom:entity-progress-card
                entity: sensor.frigate_coral_inference_speed
                layout: horizontal
                size: medium
                name: Coral inference speed
                theme: optimal_when_low
                max_value: 0.1
                min_value: 0
                bar_size: small
              - entity: sensor.soccer_juggle_tracker_juggle_worker_state
                name: Worker State
              - type: divider
              - entity: switch.juggle_annotate_processed_clips
                name: Annotate Processed Clips

          - type: markdown
            title: 🎬 Last Processed Clip
            content: >-
              {% set k = states['sensor.juggle_last_processed'] %}
              {% if k %}
                {% set u = k.attributes.get('video_url', '') %}
                **{{ k.state }}**{% if k.attributes.get('annotated') %} · annotated{% endif %}
                — best {{ k.attributes.get('best', 0) }} ({{ k.attributes.get('attempts', 0) }} attempts)
                {% if u %}<video controls preload="metadata" width="100%" src="{{ u }}"></video>
                {% else %}_(no inline video — clip isn't H.264)_{% endif %}
              {% endif %}
            visibility:
              - condition: state
                entity: sensor.juggle_last_processed
                state_not: unknown
              - condition: state
                entity: sensor.juggle_last_processed
                state_not: unavailable
              - condition: user
                users:
                  - d0f74d3b9c434882829a4a12a467bb22

  # ── Calibration ────────────────────────────────────────────────────────────
  - type: grid
    cards:
      - type: entities
        title: 🎛️ Calibration
        entities:
          - type: custom:fold-entity-row
            head:
              type: section
              label: Detection confidence
            entities:
              - entity: number.soccer_juggle_tracker_juggle_ball_confidence
                name: Ball Confidence
              - entity: number.soccer_juggle_tracker_juggle_person_confidence
                name: Person Confidence

          - type: custom:fold-entity-row
            head:
              type: section
              label: Juggle counting
            entities:
              - entity: number.soccer_juggle_tracker_juggle_contact_radius_px
                name: Contact Radius (px)
              - entity: number.soccer_juggle_tracker_juggle_min_arc_height_px
                name: Min Arc Height (px)
                icon: mdi:chart-bell-curve
              - entity: number.soccer_juggle_tracker_juggle_smoothing_window
                name: Smoothing Window
              - entity: number.soccer_juggle_tracker_juggle_lost_ball_frames
                name: Lost-Ball Frames
              - entity: number.soccer_juggle_tracker_juggle_ball_bridge_frames
                name: Ball Bridge Frames
              - entity: number.soccer_juggle_tracker_juggle_ground_margin_px
                name: Ground Margin (px)
              - entity: number.soccer_juggle_tracker_juggle_min_contact_gap_frames
                name: Min Contact Gap (frames)
                icon: mdi:timer-sand

          - type: custom:fold-entity-row
            head:
              type: section
              label: Ball CV fallback (only active when the switch is ON)
            entities:
              - entity: switch.soccer_juggle_tracker_juggle_ball_cv_fallback
                name: Ball CV Fallback
              - entity: number.soccer_juggle_tracker_juggle_ball_cv_sensitivity
                name: Ball CV Sensitivity
              - entity: number.soccer_juggle_tracker_juggle_ball_cv_min_radius
                name: Ball CV Min Radius
              - entity: number.soccer_juggle_tracker_juggle_ball_cv_max_radius
                name: Ball CV Max Radius
              - entity: number.soccer_juggle_tracker_juggle_ball_cv_search_radius
                name: Ball CV Search Radius
              - entity: number.soccer_juggle_tracker_juggle_ball_cv_edge_threshold
                name: Ball CV Edge Threshold
              - entity: number.soccer_juggle_tracker_juggle_ball_cv_accumulator_dp
                name: Ball CV Accumulator (dp)

          - type: custom:fold-entity-row
            head:
              type: section
              label: Performance & thermal
            entities:
              - entity: number.soccer_juggle_tracker_juggle_inference_resolution
                name: Inference Resolution
              - entity: number.soccer_juggle_tracker_juggle_person_pose_stride
                name: Person/Pose Stride
              - entity: number.soccer_juggle_tracker_juggle_torch_threads
                name: Torch Threads
              - entity: number.soccer_juggle_tracker_juggle_thermal_max_temp_c
                name: Thermal Max Temp (C)
              - entity: number.soccer_juggle_tracker_juggle_thermal_resume_temp_c
                name: Thermal Resume Temp (C)

        visibility:
          - condition: user
            users:
              - d0f74d3b9c434882829a4a12a467bb22

      - type: horizontal-stack
        cards:
          - show_name: true
            show_icon: true
            type: button
            entity: button.soccer_juggle_tracker_apply_calibration_restart
            name: Apply & Restart
            icon: mdi:restart
            show_state: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.soccer_juggle_tracker_apply_calibration_restart
            icon_height: 48px
          - show_name: true
            show_icon: true
            type: button
            entity: button.soccer_juggle_tracker_revert_calibration_to_defaults
            name: Revert Defaults
            icon: mdi:backup-restore
            show_state: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.soccer_juggle_tracker_revert_calibration_to_defaults
              confirmation:
                text: Discard calibration tweaks and restart with config.yaml defaults?
            icon_height: 48px

    visibility:
      - condition: user
        users:
          - d0f74d3b9c434882829a4a12a467bb22

  # ── Per-person replay clips (dynamic, shown only when replay exists) ────────
  - type: grid
    cards:
      - type: custom:auto-entities
        card:
          type: entities
          title: 🎬 Best Runs
        filter:
          include:
            - entity_id: sensor.soccer_juggle_tracker_*_juggle_high_score
              state: "> 0"
              options:
                type: custom:button-card
                show_name: false
                show_state: false
                show_icon: false
                custom_fields:
                  video: >
                    [[[
                      const u = entity.attributes.video_url;
                      const n = entity.attributes.friendly_name
                        .replace(/Soccer Juggle Tracker /i, '')
                        .replace(/ Juggle High Score$/i, '');
                      if (!u) return '';
                      return `<div style='padding:8px;text-align:left'>
                        <div style='font-size:1.1em;font-weight:bold;margin-bottom:4px'>
                          ${n} &mdash; ${entity.state} juggles
                          <a href='${u}' target='_blank' style='font-size:0.8em;margin-left:8px'>&#9654; open</a>
                        </div>
                        <video controls preload='metadata' style='width:100%;border-radius:4px' src='${u}'></video>
                      </div>`;
                    ]]]
        sort:
          method: state
          reverse: true
          numeric: true

  # ── Queue & Reprocess ──────────────────────────────────────────────────────
  - type: grid
    cards:
      - type: vertical-stack
        cards:
          - type: entities
            title: 📥 Queue & Reprocess
            entities:
              - entity: sensor.juggle_inbox_queue
                name: Inbox queue
              - entity: sensor.juggle_processed_count
                name: Processed
              - type: divider
              - entity: select.juggle_reprocess_file
                name: Reprocess file
          - type: markdown
            content: >
              {% set k = states['sensor.juggle_reprocess_preview'] %}
              {% if k %}{% set u = k.attributes.get('video_url') %}{% set p = k.attributes.get('attributed_to') %}
                {% if u %}**{{ k.state }}** · {{ p or 'No juggle attempts' }}
                  <video controls preload="metadata" width="100%" src="{{ u }}"></video>
                {% endif %}
              {% endif %}
            title: 🎬 Selected Clip
            visibility:
              - condition: state
                attribute: video_url
                entity: sensor.juggle_reprocess_preview
                state_not: ""
          - show_name: true
            show_icon: true
            type: button
            entity: button.reprocess_selected_clip
            name: Reprocess Selected Clip
            icon: mdi:reload
            tap_action:
              action: toggle
            icon_height: 48px
            grid_options:
              rows: auto
              columns: full

    visibility:
      - condition: user
        users:
          - d0f74d3b9c434882829a4a12a467bb22

  # ── Inbox management ───────────────────────────────────────────────────────
  - type: grid
    cards:
      - type: vertical-stack
        grid_options:
          columns: full
        cards:
          - type: entities
            title: 🗑️ Inbox Queue
            entities:
              - entity: sensor.juggle_inbox_queue
                name: Waiting to process
          - type: custom:auto-entities
            card:
              type: grid
              columns: 1
              square: false
            grid_options:
              columns: full
            card_param: cards
            filter:
              template: >-
                {% set queue = states['sensor.juggle_inbox_queue'] %}
                {% set clips = queue.attributes.get('clips', []) if queue else [] %}
                {% set result = namespace(cards=[]) %}
                {% for clip in clips %}
                  {% set card = {
                    'type': 'custom:button-card',
                    'label': clip.duration,
                    'variables': {
                      'thumbnail': clip.thumbnail_url,
                      'filename': clip.name,
                      'duration': clip.duration
                    },
                    'show_name': false,
                    'show_label': false,
                    'show_icon': false,
                    'show_state': false,
                    'custom_fields': {
                      'content': '[[[ const image = variables.thumbnail ? `<img src="${variables.thumbnail}" style="display:block;width:100%;max-width:640px;aspect-ratio:16/9;height:auto;object-fit:cover;border-radius:4px">` : `<ha-icon icon="mdi:video-off-outline"></ha-icon>`; return `<div style="display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;box-sizing:border-box">${image}<div style="display:block;width:100%;text-align:left;color:var(--secondary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl">${variables.filename} - ${variables.duration}</div></div>`; ]]]'
                    },
                    'tap_action': {
                      'action': 'perform-action',
                      'perform_action': 'mqtt.publish',
                      'data': {
                        'topic': 'juggle_tracker/delete_file/set',
                        'payload': clip.name,
                        'qos': 0,
                        'retain': false
                      },
                      'confirmation': {
                        'text': 'Delete ' ~ clip.name ~ ' from the inbox?'
                      }
                    },
                    'styles': {
                      'card': ['min-height: 170px', 'width: 100%', 'padding: 12px', 'cursor: pointer'],
                      'grid': [
                        'grid-template-areas: "content"',
                        'grid-template-columns: minmax(0, 1fr)',
                        'grid-template-rows: auto',
                        'justify-items: stretch'
                      ],
                      'custom_fields': {
                        'content': [
                          'grid-area: content',
                          'justify-self: stretch',
                          'display: block',
                          'width: 100%',
                          'box-sizing: border-box'
                        ]
                      }
                    }
                  } %}
                  {% set result.cards = result.cards + [card] %}
                {% endfor %}
                {{ result.cards if result.cards else [{'type': 'markdown', 'content': 'No videos are waiting in the inbox.'}] }}

    visibility:
      - condition: user
        users:
          - d0f74d3b9c434882829a4a12a467bb22

cards: []
